<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;0,800;1,300;1,400;1,700&family=Roboto:wght@400;700;900&family=Gelasio:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* The look of a classic woodworking-magazine drawings supplement: white letter pages,
   condensed sans for every label, a Century-style serif for running text, peach-filled line
   drawings, a green-ruled material list box, a blue hardware box, red only for the title and for
   identifying letters. Pages stay white in both themes (they are the drawing); only the ground darkens. */
:root{
  --desk:#e7e5e0; --desk-fg:#3a3c3e;
  --paper:#ffffff; --ink:#231f20; --ink-2:#5c5959; --rule:#231f20; --hair:#b1b0b0;
  --part:#feecda;                     /* flat fill for parts in 2D drawings */
  --steel:#c5c2be;                    /* hardware, steel */
  --red:#9b282d; --red-2:#c42d3b;     /* title; part letters and "All 4" notes */
  --green:#00553c; --green-soft:#e9f2ec;  /* material list box */
  --hw:#185578;                       /* hard-to-find hardware box */
  --sel:#185578; --sel-soft:#d6e4ee;  /* current selection */
  --bad:#b3261e; --bad-soft:#f6dcd8; --warn:#8a5a00; --warn-soft:#f6e7c8; --ok:#00553c; --ok-soft:#e9f2ec;
  --f-sans:"Roboto Condensed","Univers Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;
  --f-title:"Roboto","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-num:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Century Old Style Std","Century Schoolbook","Gelasio",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#1b1c1e;--desk-fg:#c9c4b8;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#1b1c1e;--desk-fg:#c9c4b8;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--desk);color:var(--ink);font:16px/1.45 var(--f-body);margin:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{max-width:960px;margin:0 auto;display:grid;gap:28px}
.sheet{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 32px -20px rgba(0,0,0,.5);padding:44px 52px 22px;min-width:0;display:flex;flex-direction:column}
.inner{display:grid;gap:22px;min-width:0;flex:1}
.sheet>h2{font:700 1.65rem/1 var(--f-sans);text-transform:uppercase;margin:0 0 18px;letter-spacing:0}
.foot{margin-top:34px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:baseline;font:italic 400 .8rem/1.2 var(--f-sans);color:var(--ink)}
.foot .l{font-style:italic}.foot .c{font-style:normal;font-size:.72rem}.foot .r{text-align:right;font-style:normal}
.sheet.even .foot .l{order:3;text-align:right}.sheet.even .foot .r{order:1;text-align:left}.sheet.even .foot .c{order:2}
h3{font:700 1.05rem/1.15 var(--f-sans);margin:0;text-wrap:balance}
h3 small{font-weight:300;font-style:italic;font-size:.85em;margin-left:.3em}
p{margin:0}
.fr{font-size:.62em;white-space:nowrap;letter-spacing:0}
.fr sup{vertical-align:.55em;font-size:1em}.fr sub{vertical-align:0;font-size:1em}

/* masthead */
.mast .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.mark{font:800 2.5rem/.86 var(--f-sans);text-transform:uppercase;letter-spacing:-.01em;border-bottom:0}
.mark span{display:block}
.mark small{display:block;font:italic 400 .62rem/1.2 var(--f-sans);text-transform:none;letter-spacing:0;margin-top:5px}
.mast .tt{text-align:right}
.mast h1{font:700 clamp(1.9rem,4.6vw,2.6rem)/1.05 var(--f-title);color:var(--red);margin:0;text-wrap:balance}
.mast .issue{font:700 1.05rem/1.3 var(--f-title);margin-top:4px}
.pdfl{display:inline-block;margin-top:8px;font:italic 700 .95rem/1.2 var(--f-sans);color:var(--hw);text-underline-offset:3px}
.pdfs{display:block;font:italic 300 .8rem/1.3 var(--f-sans);min-height:1.3em}
/* while the PDF is being made, and when printing: letter-width pages, no screen controls */
html.printing .stack{width:880px;max-width:none}
html.printing .vbar,html.printing .stepbox,html.printing .hint,html.printing figcaption .zb,html.printing .pdfl,html.printing .pdfs,html.printing button.lk,html.printing [data-joint],html.printing .units{display:none!important}
html.printing figure.actual{overflow:visible}html.printing figure.actual .svgw{width:auto;height:auto;aspect-ratio:var(--ar,4/3);max-width:100%}
html.printing .sheet{box-shadow:none}
@media print{
  body{background:#fff;padding:0}.stack{gap:0;max-width:none}
  .sheet{box-shadow:none;break-after:page;padding:0}
  .vbar,.stepbox,.hint,figcaption .zb,.pdfl,.pdfs,button.lk,[data-joint],.units{display:none!important}
  figure,.ml,.hwbox,.callbox,tr{break-inside:avoid}
}
.mast .sub{font:italic 400 .95rem/1.35 var(--f-title);margin-top:4px;text-wrap:balance}
.cols{columns:2 300px;column-gap:28px;font-size:.98rem;line-height:1.42}
.cols p{margin:0 0 .5em;text-indent:1em;hyphens:auto}
.cols p:first-child{text-indent:0}
.cols p.lead .dc{float:left;font:400 4.1em/.8 var(--f-body);color:var(--red);padding:.06em .08em 0 0}
.need{break-inside:avoid;margin:2px 0 12px;border:6px solid var(--green);background:var(--green-soft);padding:10px 14px 12px;font:400 .95rem/1.35 var(--f-sans)}
.need h3{font:700 1.15rem/1 var(--f-sans);text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--green);margin-bottom:6px}
.need dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;margin:0 0 6px}
.need dt{font-weight:700}.need dd{margin:0}
.need ul{margin:0;padding-left:1.05em}
.basis{break-inside:avoid;margin:2px 0 12px;border:2px solid var(--ink);padding:10px 14px 12px;font:400 .95rem/1.35 var(--f-sans)}
.basis h3{font:700 1.15rem/1 var(--f-sans);text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.basis h4{font:700 .8rem/1 var(--f-sans);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
.basis ul{margin:0;padding:0;list-style:none}
.basis li{margin:0 0 4px}
.basis .src{display:inline-block;font:700 .68rem/1.5 var(--f-sans);text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:2px;vertical-align:1px;white-space:nowrap}
.basis .src.photo{color:var(--red)}
.basis .note{color:var(--ink-2)}

/* 3D viewer: the hero illustration */
.viewer{position:relative;background:var(--paper);min-width:0;margin:22px -8px 0}
.viewer canvas{display:block;width:100%;height:clamp(340px,64vh,660px);touch-action:none;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer svg.ov{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.ov .co circle{fill:#fff;stroke:var(--ink);stroke-width:1.1}
.ov .co text{font:400 13px var(--f-num);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.ov .co line{stroke:var(--ink);stroke-width:.8}
.ov .co.hi circle{fill:var(--sel);stroke:var(--sel)}.ov .co.hi text{fill:#fff}
.ov .co.dim{opacity:.18}
.ov .co circle.ltr{fill:#fff;stroke:var(--red-2)}.ov .co text.ltr{fill:var(--red-2);font-weight:700}
.vcap{position:absolute;right:10px;bottom:8px;font:italic 700 1rem/1 var(--f-sans);pointer-events:none}
figure.mlx{position:relative;margin:0 0 -14px;z-index:0}
figure.mlx img{display:block;width:100%;height:auto}
figure.mlx svg.ov{position:absolute;inset:0;width:100%;height:100%}
figure.mlx .vcap{bottom:26px;right:4px;padding:0}
figure.mlx .co{cursor:pointer;pointer-events:auto}
figure.mlx .co.hi circle:last-of-type,figure.mlx .co.hv circle:last-of-type{fill:var(--sel);stroke:var(--sel)}figure.mlx .co.hi text,figure.mlx .co.hv text{fill:#fff}
.ml{position:relative;z-index:1}
.vbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 8px 0;border-top:1px solid var(--hair);font:400 .85rem/1 var(--f-sans)}
.vbar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.vbar label{font-weight:700;font-style:italic;color:var(--ink)}
button.b{font:400 .82rem/1 var(--f-sans);color:var(--ink);background:#fff;border:1px solid var(--ink);padding:5px 8px;cursor:pointer;border-radius:0}
button.b:hover{background:var(--sel-soft)}
button.b[aria-pressed="true"]{background:var(--ink);color:#fff}
button.b:focus-visible,input:focus-visible,tr:focus-visible,.svgw:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
input[type=range]{accent-color:var(--ink);width:150px}
.hint{position:absolute;left:10px;top:8px;font:italic 300 .8rem/1.2 var(--f-sans);color:var(--ink-2);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--hw);color:#fff;font:400 .85rem/1.3 var(--f-sans);padding:5px 8px;max-width:260px;transform:translate(12px,12px)}
.tip b{font-weight:700}
.stepbox{display:none;padding:10px 8px 0;font:400 .95rem/1.35 var(--f-sans)}
.stepbox.on{display:block}
.stepbox .t{font-weight:700}
.nogl{padding:40px 16px;text-align:center;font-family:var(--f-sans);color:var(--ink-2)}

/* material list: the green box */
.ml{border:6px solid var(--green);background:var(--green-soft);padding:12px 18px 14px;min-width:0}
.ml>h2{font:700 1.65rem/1 var(--f-sans);text-transform:uppercase;margin:0;padding-bottom:7px;border-bottom:2px solid var(--green)}
.ml .mcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:6px}
.tw{overflow-x:auto;min-width:0}
.dbk{break-inside:avoid;margin:6px 0 22px}.dbk h3{font:700 1.05rem/1.2 var(--f-sans);border-bottom:2px solid var(--ink);padding-bottom:4px;margin:0 0 8px}.dbg{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;align-items:start}.dbg figure{margin:0}.dbx{width:100%;height:auto;display:block}.dbg th{text-align:left;white-space:nowrap;vertical-align:top;padding-right:10px}@media (max-width:700px){.dbg{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font:400 .95rem/1.25 var(--f-sans);font-variant-numeric:tabular-nums}
th{font-weight:700;text-align:left;padding:5px 4px 2px;white-space:nowrap;vertical-align:bottom}
td{padding:3px 4px 2px;border-bottom:1px solid var(--rule);vertical-align:top}
.ml th.d,.ml td.d{text-align:left;padding-left:10px}
td.d{white-space:nowrap}
td .n{font-weight:700;margin-right:.3em}
.note{font:italic 300 .85rem/1.3 var(--f-sans);color:var(--ink)}
tbody tr[data-part]{cursor:pointer}
tbody tr[data-part]:hover,tbody tr.hi{background:var(--sel-soft)}
.chip{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;font:400 .78rem/1 var(--f-num);border:1px solid var(--ink);border-radius:999px;padding:0 4px;margin:1px 2px;cursor:pointer;background:#fff;color:var(--ink);vertical-align:.08em}
.chip:hover{background:var(--sel-soft)}
.mlnote{margin-top:6px}

/* hard-to-find hardware: the blue box */
.hwbox{background:var(--hw);color:#fff;padding:14px 18px 12px;font:italic 700 .98rem/1.32 var(--f-sans);min-width:0}
.hwbox h3{font:italic 700 1.45rem/1.1 var(--f-sans);margin:0 0 6px}
.hwbox ul{list-style:none;margin:0;padding:0}
.hwbox li .row{display:flex;align-items:baseline;gap:4px}
.hwbox li .it{flex:0 1 auto;min-width:0}
.hwbox li .ld{flex:1 1 0;min-width:12px;border-bottom:2px dotted rgba(255,255,255,.85);transform:translateY(-.25em)}
.hwbox li .src{flex:0 0 auto;white-space:nowrap}
.hwbox .hn{display:block;font-weight:300;font-size:.85rem;margin:-1px 0 3px}
.hwbox .foot2{margin-top:8px;text-align:center;font-weight:300}
.hwbox [data-part]{cursor:pointer}
.hwbox li.hi{outline:1px solid #fff}

/* drawings: titled in bold italic, view name in light italic, no frames */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px 34px;align-items:start}
figure{margin:0;display:flex;flex-direction:column;min-width:0;background:var(--paper);position:relative}
figure.wide{grid-column:1/-1}
figure .svgw{position:relative;overflow:hidden;touch-action:none;cursor:grab;aspect-ratio:var(--ar,4/3);max-width:100%}
figure svg.dw{display:block;width:100%;height:100%}
figcaption{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 0 4px}
figcaption .ft{font:italic 700 1rem/1.1 var(--f-sans)}
figcaption .ft small{display:block;font-weight:300;font-size:.8rem;margin-top:1px}
figcaption .zb{display:flex;gap:2px;opacity:.35;transition:opacity .15s}
figure:hover figcaption .zb,figure:focus-within figcaption .zb{opacity:1}
figcaption .zb button{font:400 .8rem/1 var(--f-sans);width:22px;height:20px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;padding:0}
figcaption .zb button:hover{background:var(--sel-soft)}
figure:fullscreen{background:#fff;padding:16px}figure:fullscreen .svgw{aspect-ratio:auto;flex:1}
svg.dw .face{fill:var(--part);stroke:none}
svg.dw .face.hw{fill:var(--steel)}
svg.dw .edge{stroke:var(--ink);stroke-width:1;fill:none;vector-effect:non-scaling-stroke;stroke-linecap:square}
svg.dw g.hi .face{fill:var(--sel-soft)} svg.dw g.hi .edge{stroke:var(--sel);stroke-width:1.6}
svg.dw .dim line,svg.dw .dim path{stroke:var(--ink);stroke-width:.6;vector-effect:non-scaling-stroke;fill:none}
svg.dw .dim polygon{fill:var(--ink)}
svg.dw .dim text{font-family:var(--f-sans);font-weight:400;fill:var(--ink)}
svg.dw .dim rect{fill:var(--paper)}
svg.dw .lbl{font-family:var(--f-sans);font-weight:300;font-style:italic;fill:var(--ink)}
svg.dw .dtx{font-family:var(--f-sans);font-weight:400;fill:var(--ink)}
svg.dw .red{font-family:var(--f-sans);font-weight:700;fill:var(--red-2)}
svg.dw .callout circle{fill:#fff;stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:.9}
svg.dw .callout text{font-family:var(--f-num);font-weight:400;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg.dw .callout line{stroke:var(--ink);stroke-width:.7;vector-effect:non-scaling-stroke}
svg.dw g.hi .callout circle,svg.dw g.hi>.callout circle{fill:var(--sel)}svg.dw g.hi .callout text{fill:#fff}
svg.dw .det-wood{fill:var(--part);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .det-end{fill:#f6d3b0;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .det-none{fill:#fff;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .det-steel{fill:var(--steel);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .thin{stroke:var(--ink);stroke-width:.6;vector-effect:non-scaling-stroke;fill:none}
svg.dw .dash{stroke-dasharray:5 3}
svg.dw .board{fill:#fff;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .piece{fill:var(--part);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw g.hi .piece{fill:var(--sel-soft);stroke:var(--sel)}

/* joinery, steps and review */
.plain th{border-bottom:2px solid var(--ink)}
.plain td.n{font-weight:700;width:2.6em}
.steps{columns:2 300px;column-gap:28px;font-size:.98rem;line-height:1.42}
.steps p{margin:0 0 .65em;hyphens:auto}
.steps p b{font:700 1rem/1 var(--f-sans)}
.steps button.lk{font:italic 400 .85rem/1 var(--f-sans);background:none;border:0;padding:0 0 0 .25em;color:var(--hw);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.callbox{border:1px solid var(--ink);padding:10px 14px;break-inside:avoid}
.callbox h3{margin-bottom:4px}
.verdict{display:inline-block;font:700 .72rem/1 var(--f-sans);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border:1px solid currentColor;vertical-align:.1em}
.v-pass{color:var(--ok);background:var(--ok-soft)}.v-fixed{color:var(--hw);background:var(--sel-soft)}.v-flag,.v-warn{color:var(--warn);background:var(--warn-soft)}.v-fail,.v-error{color:var(--bad);background:var(--bad-soft)}
.checks{display:grid;gap:5px;margin:0;padding:0;list-style:none;font:400 .95rem/1.3 var(--f-sans)}
.checks li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px;align-items:start}
.rev{display:grid;gap:12px}
.rev+.rev{border-top:2px solid var(--ink);padding-top:16px}
.rev table td:first-child{min-width:9em}
.inner>*,.rev>*,.callbox>*{min-width:0}
@media (max-width:720px){
  .sheet{padding:22px 16px 14px}
  .mast .top{grid-template-columns:minmax(0,1fr)}.mast .tt{text-align:left}
  .mark{font-size:2rem}
  .ml{padding:10px 10px 12px;border-width:4px}.ml .mcols{grid-template-columns:minmax(0,1fr)}
  .foot{grid-template-columns:1fr auto;}.foot .c{display:none}
  .viewer{margin:16px 0 0}
}
/* shop cut list, shopping list, patterns, shop aids, finishing, "don't" panels */
.ck{width:1.05em;height:1.05em;accent-color:var(--green);margin:0;vertical-align:-.15em}
.cl td,.cl th{white-space:nowrap}.cl td.nm{white-space:normal;min-width:10em}
.cl tr.grp th{padding-top:12px;border-bottom:2px solid var(--ink);font-size:.9rem}
.cl tr.done td{color:var(--ink-2)}.cl tr.done td.nm{text-decoration:line-through;text-decoration-thickness:1px}
.cl .rough{color:var(--ink-2)}
.shop{border:6px solid var(--green);background:var(--green-soft);padding:10px 16px 12px;font:400 .98rem/1.4 var(--f-sans)}
.shop h3{font:700 1.15rem/1 var(--f-sans);text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--green);margin-bottom:6px}
.shop ul{margin:0;padding-left:1.1em;columns:2 260px;column-gap:24px}.shop li{break-inside:avoid}
.shop .drawn{font-weight:300;font-style:italic}
.lgd{display:flex;flex-wrap:wrap;gap:4px 18px;font:italic 300 .85rem/1.3 var(--f-sans)}
.lgd .r{color:var(--red-2);font-style:normal;font-weight:700}
svg.dw .cutl{stroke:var(--red-2);stroke-width:1.4;stroke-dasharray:7 3;vector-effect:non-scaling-stroke;fill:none}
svg.dw .cutl.first{stroke-width:2.2;stroke-dasharray:none}
svg.dw .cutn{font-family:var(--f-sans);font-weight:700;fill:var(--red-2)}
svg.dw .gr{stroke:var(--ink-2);stroke-width:.7;vector-effect:non-scaling-stroke;fill:none}
svg.dw .grh{fill:var(--ink-2)}
svg.dw .face.sec{fill:url(#sechatch)}
/* joint details: shaded faces by direction, cut faces darker, a missing mortise in red */
svg.dw .jdf{stroke-width:.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg.dw .jdf2{fill:#fbe3cb;stroke:#fbe3cb} svg.dw .jdf0{fill:#f2d3bc;stroke:#f2d3bc} svg.dw .jdf1{fill:#e6bf9f;stroke:#e6bf9f}
svg.dw .jdf.in{fill:#a9764f;stroke:#a9764f}
svg.dw .hw .jdf{fill:var(--steel);stroke:var(--steel)}
svg.dw .jde{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round}
svg.dw .jdm{stroke:var(--red-2);stroke-width:1.8;stroke-dasharray:6 3;vector-effect:non-scaling-stroke;fill:none}
svg.dw .jdb{fill:#fff;stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke}
svg.dw .jdl line{stroke:var(--ink);stroke-width:.6;vector-effect:non-scaling-stroke}
svg.dw .jdl circle{fill:var(--ink)}
svg.dw .jdl text{font-family:var(--f-sans);font-weight:400;fill:var(--ink)}
svg.dw .jdl.bad line{stroke:var(--red-2)} svg.dw .jdl.bad circle,svg.dw .jdl.bad text{fill:var(--red-2);font-weight:700}
figure.jd .jdt{font:400 .86rem/1.35 var(--f-sans);margin-top:6px}
figure.jd .jdt th{text-align:left;font-weight:700;padding-right:10px;white-space:nowrap;vertical-align:top}
figure.jd .jdt p.note{margin:.4em 0 0}
.jdx{color:var(--red-2);font-weight:700}
figure.jd-bad figcaption .ft{color:var(--red-2)}
svg.dw .cpl{stroke:var(--ink);stroke-width:2;stroke-dasharray:14 3 3 3;vector-effect:non-scaling-stroke;fill:none}
svg.dw .cpa{fill:var(--ink)}
svg.dw .stick{fill:var(--part);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
svg.dw .tick{stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke}

  }

  const dsheet = sheet('Drawings', '<div class="figs" id="figs-el"></div>', false);
  const fe = dsheet.querySelector('#figs-el'); figs.forEach(f => fe.appendChild(f));
  if (partFigs.length || detFigs.length) {
    const ps = sheet('Part Layouts & Details', (P.details_intro ? '<p class="note" style="font-size:.95rem">' + rich(P.details_intro) + '</p>' : '') + '<div class="figs" id="figs-pd"></div>', false);
    const pe = ps.querySelector('#figs-pd'); detFigs.concat(partFigs).forEach(f => pe.appendChild(f));
  }
  // fasteners at actual size go with the hardware, after the last material list
  { const fsf = fastenerStrip(), mls = sheets.filter(x => x.getAttribute('aria-label') === 'Material List'); if (fsf && mls.length) mls[mls.length - 1].querySelector('.inner').appendChild(fsf); }

        (parts.length ? '<div class="tw"><table class="plain"><thead><tr><th>Part</th><th>T x W x L</th><th>Material</th></tr></thead><tbody>' + parts.map(q => '<tr><td>' + esc(q.name) + (q.qty > 1 ? ' (' + q.qty + ')' : '') + '</td><td class="d">' + (q.t != null ? F(C.parseLen(q.t)) + ' x ' + F(C.parseLen(q.w)) + ' x ' + F(C.parseLen(q.l)) : esc(q.size || '')) + '</td><td>' + esc(q.material || '') + '</td></tr>').join('') + '</tbody></table></div>' : '') +

  // ---- joinery ----

  }
  // ---- drawer breakout: every drawer opening with its slide, box, front and pull (plan.drawers) ----

  if (dRows.length) {

    const sv = (r) => {
      const o = r.opening, b = r.box, W = o.w, H = o.h, sc = Math.min(300 / (W + 1.5), 170 / (H + 1.5)), x0 = o.at[0] - 0.75, z1 = o.at[2] + H + 0.75;

        }

      }
      if (r.front) { const e = r.front.edges; s += '<rect x="' + X(o.at[0] - e.left) + '" y="' + Y(o.at[2] + H + e.top) + '" width="' + Wd(r.front.w) + '" height="' + Wd(r.front.h) + '" fill="none" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>'; }

    const html = groups.map((g, gi) => {

        rows.push(tr('Runner room', F(s.below) + ' under the box, ' + F(s.above) + ' over it; box at most ' + F(o.h) + ' − ' + F(s.h) + ' = ' + F(o.h - s.h) + ' high'));
        rows.push(tr('Bottom & notch', 'Bottom ' + F(b.recess) + ' up from the bottom of the sides (at least ' + F(s.recess) + '); notch each back corner ' + F(s.notch[0]) + ' wide × ' + F(s.notch[1]) + ' high and drill the runner hook hole'));

      if (b.w) rows.push(tr('Box parts', r.parts.map(id => M.byId[id]).filter(Boolean).map(q => chip(q.id) + ' ' + esc(q.name) + ' ' + (q.localSolid && q.localSolid.bbox ? [0, 1, 2].map(k => q.localSolid.bbox.max[k] - q.localSolid.bbox.min[k]).sort((u, v) => u - v).map(v => F(v)).join(' × ') : '')).join('<br>')));

  // ---- door breakout: every door opening with its leaves, hinges, cups and pulls (plan.doors) ----
  const oRows = (P.doors || []).length ? C.doorChecks(M, P, () => {}, () => {}, () => {}) : [];
  if (oRows.some(r => r.leaves.length)) {
    const groups = [];
    for (const r of oRows) { if (!r.leaves.length) continue; const g = groups.find(x => x.name === r.name); if (g) g.rows.push(r); else groups.push({ name: r.name, rows: [r] }); }
    const mmv = v => (Math.round(v * 10) / 10) + ' mm';
    const sv = (r) => {

        s += '<text x="' + X(lx + L.w / 2) + '" y="' + Y(lz + L.h / 2) + '" dy="14" font-size="9" text-anchor="middle" dominant-baseline="central" fill="var(--ink)">hinged ' + L.side + '</text>';
      }

    };
    const html = groups.map(g => {
      const r = g.rows[0], s = r.hinge, o = r.opening, n = g.rows.length, rec = P.doors.find(d => (d.name || '') === g.name) || {};
      const tr = (k, v) => '<tr><th>' + k + '</th><td>' + v + '</td></tr>';
      const ed = v => Math.abs(v) < 1 / 128 ? 'flush' : v > 0 ? F(v) + ' overlay' : F(-v) + ' reveal';

      rows.push(tr('Opening', F(o.w) + ' wide × ' + F(o.h) + ' high · ' + esc(r.cabinet) + ' · ' + esc(r.style) + (r.leaves.length > 1 ? ' · pair' : ' · single door')));
      rows.push(tr('Case edge around it', 'left ' + F(r.frame.left) + ', right ' + F(r.frame.right) + ', top ' + F(r.frame.top) + ', bottom ' + F(r.frame.bottom)));
      const L0 = r.leaves[0];

      const meet = (L, e) => r.leaves.length > 1 && ((L.side === 'left' && e === 'right') || (L.side === 'right' && e === 'left'));
      rows.push(tr('Edges', r.leaves.map(L => (r.leaves.length > 1 ? L.side + '-hinged door: ' : '') + ['left', 'right', 'top', 'bottom'].filter(e => !meet(L, e)).map(e => e + ' ' + ed(L.edges[e])).join(', ')).join('<br>') + (r.gap != null ? '<br><b>' + F(r.gap) + '</b> gap where the doors meet' : '')));
      rows.push(tr('Hinge', '<b>' + esc(s.name) + '</b>' + (s.angle ? ' · opens ' + s.angle + '°' : '') + (s.pattern ? ' · screw pattern ' + esc(s.pattern) : '') + (s.source ? '<div class="note">Numbers from ' + esc(s.source) + '.</div>' : '')));
      rows.push(tr('Hinges per door', r.leaves.map(L => (L.hinges || []).length + ' (needs ' + L.need + ') at ' + (L.hinges || []).map(z => F(z)).join(', ') + ' up from the door bottom').join('<br>')));
      if (L0.cup != null) {
        rows.push(tr('Cup bore', (s.cup ? s.cup + ' mm Forstner, ' + (s.depth ? s.depth + ' mm deep' : 'to the hinge sheet') + ', ' : '') + '<b>' + L0.cup + ' mm</b> from the door edge to the cup (cup centre ' + mmv(L0.cup + (s.cup || 35) / 2) + ' = ' + F((L0.cup + (s.cup || 35) / 2) / 25.4) + ' in)' + (L0.bore ? '; the plan bores it ' + mmv(L0.bore.d) + ' × ' + mmv(L0.bore.depth) : '')));

  // ---- joint details: every joint drawn on its own, from the model, the mating parts pulled apart ----
  // Each detail crops the parts to where they meet, slides them apart the way the joint goes together,
  // and dimensions what was cut for it: tenons and their mortises, dados, grooves, rabbets, laps, slots
  // and bores. Nothing here is authored, so a tenon with no mortise cut for it shows up in red.
  function jointDetails() {

      }

      const R = box(pair.R.min, pair.R.max);

      const used = [pair.A, pair.B];
      for (const p of pool) for (const I of p.instances) {
        if (used.length >= 4 || used.some(u => u.I === I) || !I.bbox) continue;

      }

      }
      // the part that stays put: the one with the most cut away where they meet, else the biggest
      const cutVol = u => u.I.cuts.reduce((s, c) => { const x = C.inter(c, zone); return s + (x ? C.vol(x) : 0); }, 0);
      const bulk = u => C.vol(u.I.bbox);
      const host = used.slice().sort((a, b) => (cutVol(b) - cutVol(a)) || (bulk(b) - bulk(a)))[0];
      // which way each other part comes out of the joint
      const opening = (cut, b) => [2, 0, 1].map(a => {
        const lo = cut.min[a] <= b.min[a] + E, hi = cut.max[a] >= b.max[a] - E;

      }).filter(Boolean);
      let axis = null;
      for (const g of used) {
        if (g === host) continue;
        const gc = mid(g.body), hc = mid(host.body);
        let ax = null, sg = 0;
        const ten = g.I.tenons.find(t => C.inter(t, grow(host.I.bbox, E)));
        if (ten) {
          for (let a = 0; a < 3; a++) if (ten.max[a] <= g.body.min[a] + E || ten.min[a] >= g.body.max[a] - E) { ax = a; sg = ten.min[a] >= g.body.max[a] - E ? -1 : 1; }
        }
        if (ax == null) {
          const cut = host.I.cuts.map(c => C.inter(c, grow(g.I.bbox, E))).find(Boolean);
          const full = cut && host.I.cuts.find(c => C.inter(c, grow(g.I.bbox, E)));
          if (full) {
            const ops = opening(C.inter(full, host.I.bbox) || full, host.I.bbox);
            const best = ops.sort((p, q) => Math.abs(gc[q.a] - hc[q.a]) / ext(host.I.bbox)[q.a] - Math.abs(gc[p.a] - hc[p.a]) / ext(host.I.bbox)[p.a])[0];
            if (best) { ax = best.a; sg = best.s; }
          }
        }
        if (ax == null) {
          const own = g.I.cuts.find(c => C.inter(c, grow(host.I.bbox, E)));
          const ops = own ? opening(C.inter(own, g.I.bbox) || own, g.I.bbox) : [];
          if (ops.length) { ax = ops[0].a; sg = -ops[0].s; }
        }
        if (ax == null) {
          const r = ext(R), rel = [0, 1, 2].map(a => Math.abs(gc[a] - hc[a]) / (ext(g.I.bbox)[a] + ext(host.I.bbox)[a] || 1));
          ax = r.indexOf(Math.min(...r));
          if (r.filter(v => v <= E).length !== 1) ax = rel.indexOf(Math.max(...rel));

      s[axis.a] = axis.s;
      for (const c of host.I.cuts) { const x = C.inter(c, zone); if (!x) continue; for (const o of opening(C.inter(c, host.I.bbox) || c, host.I.bbox)) if (o.a !== axis.a && o.a !== 2) s[o.a] = o.s; }

      const shapeMarks = [];

            // curves and angles: the exact faces, far to near, shaded by the way they face

            const faces = [];
            for (let a = 0; a < 3; a++) {

              const P3 = (vb, vd) => { const p = [0, 0, 0]; p[a] = pa; p[b] = vb; p[d] = vd; return p; };
              const b0 = G[b][c[b]], b1 = G[b][c[b] + 1], d0 = G[d][c[d]], d1 = G[d][c[d] + 1];
              const q = [P3(b0, d0), P3(b1, d0), P3(b1, d1), P3(b0, d1)];
              const ctr = P3((b0 + b1) / 2, (d0 + d1) / 2);
              const inCut = u.I.cuts.some(k => ctr.every((v, i) => v > k.min[i] - E && v < k.max[i] + E) && [0, 1, 2].some(i => i !== a && ctr[i] > k.min[i] + E && ctr[i] < k.max[i] - E));
              // outline only where this flat face ends: no coplanar face continues past the edge

              const ed = [];
              if (!cont(d, -1)) ed.push([q[0], q[1]]);
              if (!cont(b, 1)) ed.push([q[1], q[2]]);
              if (!cont(d, 1)) ed.push([q[2], q[3]]);
              if (!cont(b, -1)) ed.push([q[3], q[0]]);
              faces.push({ q, cls: 'jdf jdf' + a + (inCut ? ' in' : ''), ed });
            }
            for (const f of faces) poly(g, f.q.map(p => at(u, p)), f.cls);

        }
        const boxEdges = (g, u, b, cls) => {
          const P8 = [0, 1, 2, 3, 4, 5, 6, 7].map(n => [n & 1 ? b.max[0] : b.min[0], n & 2 ? b.max[1] : b.min[1], n & 4 ? b.max[2] : b.min[2]]);

/* ---------- printable PDF: each sheet becomes letter pages, made in the browser ---------- */
(function () {
  const link = document.getElementById('pdf'), out = document.getElementById('pdfs'); if (!link) return;
  const LIBS = ['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];

  const frames = n => new Promise(r => { const f = () => (n-- > 0 ? requestAnimationFrame(f) : r()); f(); });
  // SVG drawings are styled by the stylesheet; html2canvas renders SVG as an image, so copy the computed look onto each element first
  const PROPS = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor', 'dominant-baseline'];
  function inlineSVG() {
    const undo = [];
    document.querySelectorAll('.sheet svg').forEach(svg => {
      const vb = svg.viewBox && svg.viewBox.baseVal, r = svg.getBoundingClientRect();
      const k = vb && vb.width && r.width ? vb.width / r.width : 1; // non-scaling strokes: px on screen -> drawing units

          const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, -x0 * DPI, -y0 * DPI, win * DPI, hin * DPI);

          const ox = MG, oy = MG + HEAD;
          pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', ox, oy, tw * 72, th * 72);
          pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.text(title + (rows * cols > 1 ? '  ·  page ' + String.fromCharCode(65 + r) + (q + 1) + ' (' + rows + ' row' + (rows > 1 ? 's' : '') + ' x ' + cols + ')' : ''), MG, MG + 8);
          pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.text('FULL SIZE: print at 100% ("Actual size"). Overlap ' + (T.lap * 4) + '/4" with the next page and match the marks.', MG, MG + 18);
          // corner marks at the tile edges, for lining up neighbouring pages
          pdf.setLineWidth(0.5);

})();

    const box = new THREE.Box3();
    for (const r of shown) { const b = r.I.solid.bbox; box.expandByPoint(new THREE.Vector3(...b.min).add(r.group.position)); box.expandByPoint(new THREE.Vector3(...b.max).add(r.group.position)); }
    const c = box.getCenter(new THREE.Vector3()), br = box.getBoundingSphere(new THREE.Sphere()).radius;
    // in perspective, stand as far back as the main view does for a piece this size
    const D = pc ? reach(br * 1.08, 1) : 1000;
    cam.position.copy(c).addScaledVector(dir, D); cam.lookAt(c); cam.updateMatrixWorld();
    // tight frame in view space (in perspective, on the plane one unit in front of the eye), with room
    // around it for the balloons
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const r of shown) { const b = r.I.solid.bbox; for (const X of [b.min[0], b.max[0]]) for (const Y of [b.min[1], b.max[1]]) for (const Z of [b.min[2], b.max[2]]) { const v = new THREE.Vector3(X, Y, Z).add(r.group.position).applyMatrix4(cam.matrixWorldInverse); if (pc) v.divideScalar(-v.z); x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); } }
    const pad = Math.max(x1 - x0, y1 - y0) * 0.09;
    x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const H = Math.round(Math.max(420, Math.min(1100, W * (y1 - y0) / (x1 - x0))));
    const want = W / H; let sw = x1 - x0, sh = y1 - y0;
    if (sw / sh < want) { const d = sh * want - sw; x0 -= d / 2; x1 += d / 2; } else { const d = sw / want - sh; y0 -= d / 2; y1 += d / 2; }
    if (pc) {
      const n = Math.max(0.5, D - 4 * br);
      cam.projectionMatrix.makePerspective(x0 * n, x1 * n, y1 * n, y0 * n, n, D + 4 * br);
      cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
    } else { Object.assign(cam, { left: x0, right: x1, top: y1, bottom: y0 }); cam.updateProjectionMatrix(); }
    snap.setSize(W, H, false);
    for (const m of lineMats) { m.resolution.set(W, H); m.linewidth = 1.5 * k; }
    snap.render(scene, cam);
    const img = fig.querySelector('img'); img.src = snap.domElement.toDataURL('image/png'); img.width = W; img.height = H;
    const svg = fig.querySelector('svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const proj = v => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; };
    balloons(svg, proj, proj(c), k, () => 'co', cam);
    fig.hidden = false;
  }
  snap.dispose(); if (snap.forceContextLoss) snap.forceContextLoss();
  explode = save.explode; isolate = save.isolate; stepIdx = save.stepIdx; bus.sel = save.sel;
  for (const m of lineMats) m.linewidth = 1.5;
  apply(); resize();
}

let dirty = true;
controls.addEventListener('change', () => { dirty = true; });
function loop(now) {
  requestAnimationFrame(loop);
  if (tw) tw(now);
  if (playing) playing(now);
  const moved = controls.update();
  if (!dirty && !moved && !tw && !playing) return;
  dirty = false;
  renderer.setClearColor(new THREE.Color('#ffffff'), 1);
  renderer.render(scene, camera);
  callouts();
}
document.getElementById('hint').textContent = (P.view && P.view.hint) || '';
setView((P.view && P.view.start && VIEWS[P.view.start]) || VIEWS['Front right'], null, null, true);
curR = sphere.radius;
apply(); resize();
try { sectionPlates(); } catch (e) { console.warn('section exploded views not drawn', e); }
requestAnimationFrame(loop);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { apply(); });
new MutationObserver(() => apply()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
// orbit zoom changes camera.zoom; fold it into the frame so the callouts and fit stay in sync
// in perspective, orbit zoom moves the camera instead; read the new frame off its distance
controls.addEventListener('change', () => {
  if (camera.zoom !== 1) { curR /= camera.zoom; camera.zoom = 1; frame(); }
  if (camera === persp && !tw) {
    const a = camera.aspect, D = camera.position.distanceTo(controls.target), want = reach(curR * 1.08, a);
    if (Math.abs(D - want) > want * 1e-3) { curR *= D / want; frame(); }
  }
});
